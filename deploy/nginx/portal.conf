server {
    listen 80;
    listen [::]:80;
    server_name fjayson.com www.fjayson.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://fjayson.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fjayson.com;

    ssl_certificate /etc/letsencrypt/live/fjayson.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fjayson.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://fjayson.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fjayson.com;

    ssl_certificate /etc/letsencrypt/live/fjayson.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fjayson.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/portal;
    index index.html;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
