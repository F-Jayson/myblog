# GitHub 加速节点反向代理模板。把 accel.example.com 换成自己的域名后放进 sites-available。
#
# 这份配置里最要紧的不是缓存头，而是 proxy_buffering off：开了缓冲等于让节点把
# 每个分片都写进 Nginx 的临时磁盘，大文件下载与 git clone 会直接卡死（见文档第 8 节）。

upstream github_accel {
	# Docker Compose 把节点绑在 127.0.0.1:8787；systemd 部署时端口一致。
	server 127.0.0.1:8787;
	# 长连接复用：下载与 git 都可能长跑，频繁握手会拖慢小文件场景。
	keepalive 32;
}

# 如果节点前面还有一层 CDN 在吃带宽，别用下面 location 里的
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# 它会把 CDN 回源 IP 追加到末尾，使所有用户共用同一个限流桶。改成：
#   map $http_x_forwarded_for $accel_client_xff {
#       ""      $remote_addr;
#       default $http_x_forwarded_for;
#   }
#   proxy_set_header X-Forwarded-For $accel_client_xff;
# 详见 docs/github-accelerator-deploy.md 第 2.3.1 节。

# 下载与 git 的响应体可能是几个 GB，这一层绝对不能缓冲。
proxy_buffering off;
proxy_request_buffering off;
client_max_body_size 0;

server {
	listen 80;
	listen [::]:80;
	server_name accel.example.com;

	# 统一跳 HTTPS：ticket 会出现在 URL 上，明文传输等于把下载权限泄露给中间人。
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name accel.example.com;

	ssl_certificate /etc/letsencrypt/live/accel.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/accel.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	# 压缩对 zip / tar.gz / git pack 没有意义，还会让 Content-Length 失配、破坏断点续传。
	gzip off;

	location / {
		proxy_pass http://github_accel;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		# 节点用 X-Forwarded-For 的最后一段做限流，必须由这里追加真实地址。
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_buffering off;
		proxy_request_buffering off;
		client_max_body_size 0;

		# 一个 1GB 的文件在慢线路上能跑几十分钟，默认 60s 一定会被掐断。
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_connect_timeout 15s;

		# 下载过程中的重定向与断点续传需要这些头原样到客户端。
		proxy_pass_request_headers on;
	}

	location /api/ {
		proxy_pass http://github_accel;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# 健康检查与 Release 列表都是小 JSON，缓冲反而更快，这里保留默认。
		proxy_read_timeout 30s;
	}
}
